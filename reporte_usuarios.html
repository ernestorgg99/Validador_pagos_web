<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Rendimiento - Sistema de Pagos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <script>
            (function () {
                const rol = localStorage.getItem('usuario_rol');
                const perms = localStorage.getItem('usuario_permisos') || '[]';
                if (rol !== 'administrador' && !perms.includes('ver_reportes') && !perms.includes('all')) {
                    alert("Acceso Restringido: No tienes permiso para ver reportes.");
                    window.location.href = 'index.html';
                }
            })();
        </script>
        <div class="flex justify-between items-center mb-10">
            <div>
                <button onclick="window.location.href='index.html'"
                    class="text-blue-600 font-black uppercase text-xs flex items-center gap-2 mb-2 hover:underline">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al Inicio
                </button>
                <h2 class="text-4xl font-black text-gray-800 uppercase tracking-tighter">Rendimiento del Equipo</h2>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-200">
                <p class="text-[10px] font-black text-gray-400 uppercase leading-none">Total Pagos Validados</p>
                <p id="total-general" class="text-2xl font-black text-blue-600">0</p>
            </div>
        </div>

        <div id="fichasContainer" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
        </div>
    </div>

    <div id="modalDetalle"
        class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl max-h-[85vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden">
            <div class="p-8 bg-blue-600 text-white flex justify-between items-center">
                <div>
                    <h3 id="det-user-name" class="text-2xl font-black uppercase tracking-tighter">Usuario</h3>
                    <input type="date" id="filtroFecha"
                        class="mt-2 bg-blue-700 border-none text-white text-xs p-2 rounded-xl font-bold focus:ring-0">
                </div>
                <button onclick="cerrarModal()" class="bg-white/20 p-2 rounded-2xl hover:bg-white/30">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="flex-grow overflow-y-auto p-8">
                <table class="w-full">
                    <thead class="text-[10px] font-black uppercase text-gray-400 border-b">
                        <tr>
                            <th class="text-left pb-4">Fecha/Hora</th>
                            <th class="text-left pb-4">Referencia</th>
                            <th class="text-left pb-4">Banco</th>
                            <th class="text-right pb-4">Monto (Bs)</th>
                            <th class="text-right pb-4">USD</th>
                        </tr>
                    </thead>
                    <tbody id="listaDetalleBody" class="text-sm font-bold text-gray-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="reporte_usuarios.js"></script>
</body>

</html>
