<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pagos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-700 text-white p-6 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="bg-white/20 p-2 rounded-lg hover:bg-white/30 transition">
                    <i data-lucide="arrow-left"></i>
                </a>
                <h1 class="text-2xl font-black">HISTORIAL DE PAGOS MÓVILES</h1>
            </div>
            <button onclick="cargarDatos()" class="flex items-center space-x-2 bg-green-500 hover:bg-green-600 px-6 py-2 rounded-xl font-bold transition">
                <i data-lucide="refresh-cw" id="sync-icon"></i>
                <span>Actualizar</span>
            </button>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-10">
        <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 border-b-2 border-gray-100 text-gray-600">
                            <th class="p-6 font-black uppercase text-sm tracking-wider">Banco Origen</th>
                            <th class="p-6 font-black uppercase text-sm tracking-wider">Monto (Bs.)</th>
                            <th class="p-6 font-black uppercase text-sm tracking-wider">Referencia</th>
                            <th class="p-6 font-black uppercase text-sm tracking-wider">Fecha y Hora</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="divide-y divide-gray-100">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://relaxed-jorrie-ergg99-b3008c3b.koyeb.app";

        async function cargarDatos() {
            const icon = document.getElementById('sync-icon');
            const tbody = document.getElementById('tabla-cuerpo');
            icon.classList.add('animate-spin');

            try {
                const response = await fetch(`${API_URL}/api/pagos/listar`);
                const pagos = await response.json();

                tbody.innerHTML = '';
                pagos.forEach(p => {
    // Validamos que exista fecha_hora antes de crear el Date
    const fechaObj = p.fecha_hora ? new Date(p.fecha_hora) : new Date();
    
    const row = `
        <tr class="hover:bg-blue-50/50 transition-colors">
            <td class="p-6 font-bold text-gray-700">${p.banco_origen}</td>
            <td class="p-6 font-black text-blue-600 text-lg">${parseFloat(p.monto).toFixed(2)} Bs.</td>
            <td class="p-6 font-mono text-gray-500 font-bold">${p.referencia}</td>
            <td class="p-6 text-gray-500">
                ${fechaObj.toLocaleDateString('es-VE')} - 
                ${fechaObj.toLocaleTimeString('es-VE', {hour: '2-digit', minute:'2-digit', hour12: true})}
            </td>
        </tr>
    `;
    tbody.innerHTML += row;
});
                lucide.createIcons();
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-red-500 font-bold">Error al cargar datos del servidor</td></tr>';
            } finally {
                setTimeout(() => icon.classList.remove('animate-spin'), 500);
            }
        }

        window.onload = cargarDatos;
        lucide.createIcons();
    </script>
</body>
</html>
