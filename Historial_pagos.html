<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pagos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-700 text-white p-6 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="bg-white/20 p-2 rounded-lg hover:bg-white/30 transition">
                    <i data-lucide="arrow-left"></i>
                </a>
                <h1 class="text-2xl font-black">HISTORIAL DE PAGOS MÓVILES</h1>
            </div>
            <button onclick="cargarDatos()" class="flex items-center space-x-2 bg-green-500 hover:bg-green-600 px-6 py-2 rounded-xl font-bold transition">
                <i data-lucide="refresh-cw" id="sync-icon"></i>
                <span>Actualizar</span>
            </button>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8">
    <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100">
        <div class="hidden md:block overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b-2 border-gray-100">
                    <tr>
                        <th class="p-6 text-sm font-black text-blue-600 uppercase">Banco</th>
                        <th class="p-6 text-sm font-black text-blue-600 uppercase">Monto</th>
                        <th class="p-6 text-sm font-black text-blue-600 uppercase">Referencia</th>
                        <th class="p-6 text-sm font-black text-blue-600 uppercase">Fecha y Hora</th>
                    </tr>
                </thead>
                <tbody id="tabla-pagos-desktop">
                    </tbody>
            </table>
        </div>

        <div id="lista-pagos-mobile" class="md:hidden divide-y divide-gray-100">
            </div>
    </div>
</main>

<script>
    const API_URL = "https://relaxed-jorrie-ergg99-b3008c3b.koyeb.app";
    
    async function cargarDatos() {
        const icon = document.getElementById('sync-icon');
        const tbody = document.getElementById('tabla-pagos-desktop');
        const mobileDiv = document.getElementById('lista-pagos-mobile');
        
        icon.classList.add('animate-spin');

        try {
            const response = await fetch(`${API_URL}/api/pagos/listar`);
            const pagos = await response.json();

            tbody.innerHTML = '';
            mobileDiv.innerHTML = '';

            pagos.forEach(p => {
                const fechaObj = p.fecha_hora ? new Date(p.fecha_hora) : new Date();
                const fechaStr = fechaObj.toLocaleDateString('es-VE');
                const horaStr = fechaObj.toLocaleTimeString('es-VE', {hour: '2-digit', minute:'2-digit', hour12: true});

                // FILA PARA DESKTOP
                tbody.innerHTML += `
                    <tr class="hover:bg-blue-50/50 transition-colors border-b border-gray-50">
                        <td class="p-6 font-bold text-gray-700">${p.banco_origen}</td>
                        <td class="p-6 font-black text-blue-600 text-lg">${parseFloat(p.monto).toFixed(2)} Bs.</td>
                        <td class="p-6 font-mono text-gray-500 font-bold">${p.referencia}</td>
                        <td class="p-6 text-gray-500">${fechaStr} - ${horaStr}</td>
                    </tr>
                `;

                // TARJETA PARA MÓVIL
                mobileDiv.innerHTML += `
                    <div class="p-6 active:bg-gray-50 transition-colors">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-black text-blue-500 uppercase tracking-widest">${p.banco_origen}</span>
                            <span class="text-xs font-bold text-gray-400">${fechaStr}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex flex-col">
                                <span class="text-lg font-black text-gray-800">${parseFloat(p.monto).toFixed(2)} Bs.</span>
                                <span class="text-sm font-mono text-gray-400 font-bold">Ref: ${p.referencia}</span>
                            </div>
                            <div class="bg-blue-100 p-2 rounded-full text-blue-600">
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </div>
                        </div>
                        <div class="mt-2 text-[10px] text-gray-400 font-medium">${horaStr}</div>
                    </div>
                `;
            });
            
            lucide.createIcons();
            
        } catch (e) {
            const errorMsg = '<div class="p-10 text-center text-red-500 font-bold">Error al conectar con el servidor</div>';
            tbody.innerHTML = `<tr><td colspan="4">${errorMsg}</td></tr>`;
            mobileDiv.innerHTML = errorMsg;
        } finally {
            setTimeout(() => icon.classList.remove('animate-spin'), 500);
        }
    }

    window.onload = cargarDatos;
    lucide.createIcons();
    </script>
</body>
</html>
