<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítico - ValidadorPagos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-4">
                    <a href="index.html" class="p-2 rounded-xl hover:bg-gray-100 text-gray-500 transition">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </a>
                    <h1 class="text-xl font-black text-gray-800 tracking-tight uppercase">Dashboard</h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="cargarDashboard()" class="p-2 rounded-xl text-blue-600 hover:bg-blue-50 transition" title="Actualizar">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Total Hoy -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-blue-500 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Validado Hoy</p>
                        <h2 class="text-2xl font-black text-gray-800 mt-1">Bs <span id="kpi-monto">0.00</span></h2>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-2xl text-blue-600">
                        <i data-lucide="dollar-sign" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <!-- USD Hoy -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-emerald-500 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Validado Hoy</p>
                        <h2 class="text-2xl font-black text-gray-800 mt-1">$ <span id="kpi-monto-usd">0.00</span></h2>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-2xl text-emerald-600">
                        <i data-lucide="trending-up" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <!-- Tasa BCV Hoy -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-teal-500 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Tasa BCV</p>
                        <h2 class="text-2xl font-black text-gray-800 mt-1"><span id="kpi-tasa">--</span> Bs/USD</h2>
                        <p class="text-[11px] text-gray-500 mt-2" id="kpi-tasa-fuente">Fuente: --</p>
                    </div>
                    <div class="bg-teal-50 p-3 rounded-2xl text-teal-600">
                        <i data-lucide="globe" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <!-- Cantidad Hoy -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-indigo-500 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Transacciones</p>
                        <h2 class="text-2xl font-black text-gray-800 mt-1" id="kpi-cantidad">0</h2>
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-2xl text-indigo-600">
                        <i data-lucide="activity" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row 1 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Tendencia (Ocupa 2 columnas) -->
            <div class="bg-white p-6 rounded-3xl shadow-sm lg:col-span-2">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-6">
                    <h3 class="text-lg font-black text-gray-800 flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-5 h-5 text-green-500"></i> Tendencia de Pagos
                    </h3>
                    <div class="flex items-center gap-2 flex-wrap">
                        <input type="date" id="trend-fecha-inicio"
                            class="bg-gray-100 text-xs font-medium text-gray-700 rounded-lg border-none px-2 py-1.5 outline-none focus:ring-2 focus:ring-blue-500">
                        <span class="text-gray-400 text-xs font-bold">a</span>
                        <input type="date" id="trend-fecha-fin"
                            class="bg-gray-100 text-xs font-medium text-gray-700 rounded-lg border-none px-2 py-1.5 outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="aplicarFiltroTendencia()"
                            class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-blue-700 transition">
                            Filtrar
                        </button>
                        <button onclick="limpiarFiltroTendencia()"
                            class="bg-gray-200 text-gray-600 text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-gray-300 transition">
                            ✕
                        </button>
                    </div>
                </div>
                <div class="relative h-72 w-full">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Distribución Bancos -->
            <div class="bg-white p-6 rounded-3xl shadow-sm">
                <h3 class="text-lg font-black text-gray-800 mb-6 flex items-center gap-2">
                    <i data-lucide="pie-chart" class="w-5 h-5 text-purple-500"></i> Por Banco
                </h3>
                <div class="relative h-64 w-full flex justify-center">
                    <canvas id="bankChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Charts Row 2 & Tables -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Top Operadores -->
            <div class="bg-white p-6 rounded-3xl shadow-sm">
                <h3 class="text-lg font-black text-gray-800 mb-6 flex items-center gap-2">
                    <i data-lucide="users" class="w-5 h-5 text-orange-500"></i> Top Operadores
                </h3>
                <div class="relative h-64 w-full">
                    <canvas id="operatorChart"></canvas>
                </div>
            </div>

            <!-- Conciliación Diaria (Tabla rápida) -->
            <div class="bg-white p-6 rounded-3xl shadow-sm">
                <div class="flex flex-col gap-2 sm:flex-row sm:justify-between sm:items-center mb-6">
                    <div>
                        <h3 class="text-lg font-black text-gray-800 flex items-center gap-2">
                            <i data-lucide="clipboard-check" class="w-5 h-5 text-teal-500"></i> Conciliación Hoy
                        </h3>
                        <p class="text-sm text-gray-500 mt-1">Tasa BCV: <span id="conciliacion-tasa-bcv">--</span> Bs/USD</p>
                    </div>
                    <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-lg" id="fecha-conciliacion">--/--/--</span>
                </div>
                
                <div class="overflow-hidden rounded-xl border border-gray-100">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-500 font-bold uppercase text-xs">
                            <tr>
                                <th class="px-4 py-3">Banco</th>
                                <th class="px-4 py-3 text-right">Cant.</th>
                                <th class="px-4 py-3 text-right">Total (Bs)</th>
                                <th class="px-4 py-3 text-right">Total (USD)</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-conciliacion" class="divide-y divide-gray-100">
                            <!-- JS llenará esto -->
                            <tr>
                                <td colspan="3" class="px-4 py-8 text-center text-gray-400 italic">Cargando datos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script src="config.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
