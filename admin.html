<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-xl min-h-screen flex flex-col shrink-0">
        <div class="p-4 pb-0">
            <button onclick="window.location.href='index.html'"
                class="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" aria-hidden="true" class="lucide lucide-arrow-left w-5 h-5"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg> Volver
            </button>
        </div>
        <div class="p-6 border-b border-gray-100">
            <h1 class="text-lg font-black text-gray-800 uppercase tracking-tighter">Panel Admin</h1>
            <p class="text-[10px] font-bold text-blue-600 uppercase">Validador de Pagos</p>
        </div>

        <nav class="flex-1 p-3 space-y-1">
            <a href="admin.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition bg-blue-50 text-blue-700">
                <i data-lucide="users" class="w-5 h-5"></i> Usuarios
            </a>
            <a href="monedas.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition text-gray-500 hover:bg-gray-100">
                <i data-lucide="dollar-sign" class="w-5 h-5"></i> Moneda / Tasas
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto">
        <div class="max-w-6xl mx-auto">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-3xl font-black text-gray-800 uppercase tracking-tighter">Gestión de Personal</h1>
                    <p class="text-blue-600 font-bold">Panel de Administración Central</p>
                </div>
            </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border-l-8 border-yellow-400">
                <p class="text-xs font-black text-gray-400 uppercase">Pendientes</p>
                <h2 id="count-pendientes" class="text-4xl font-black text-gray-800">0</h2>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border-l-8 border-green-500">
                <p class="text-xs font-black text-gray-400 uppercase">Activos</p>
                <h2 id="count-activos" class="text-4xl font-black text-gray-800">0</h2>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border-l-8 border-blue-600">
                <p class="text-xs font-black text-gray-400 uppercase">Total Grupos</p>
                <h2 id="count-grupos" class="text-4xl font-black text-gray-800">1</h2>
            </div>
        </div>

        <!-- Barra de Filtros -->
        <div class="bg-white rounded-[2rem] shadow-sm p-4 mb-6 flex flex-wrap items-center gap-4">
            <div class="relative flex-1 min-w-[200px]">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                <input type="text" id="buscador" placeholder="Buscar por nombre o usuario..."
                    class="w-full pl-12 pr-4 py-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-800">
            </div>

            <select id="filtro-estado"
                class="bg-gray-50 rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-800 text-sm">
                <option value="todos">Todos los estados</option>
                <option value="activos">Activos</option>
                <option value="pendientes">Pendientes</option>
            </select>

            <select id="filtro-rol"
                class="bg-gray-50 rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-800 text-sm">
                <option value="todos">Todos los roles</option>
                <option value="administrador">Administrador</option>
                <option value="supervisor">Supervisor</option>
                <option value="operador">Operador</option>
            </select>

            <button id="btn-agrupar"
                class="bg-gray-50 px-4 py-3 rounded-xl hover:bg-blue-100 hover:text-blue-700 transition flex items-center gap-2 border-none focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold text-gray-600">
                <i data-lucide="layers" class="w-5 h-5"></i>
                <span>Agrupar por rol</span>
            </button>

            <button id="btn-limpiar"
                class="bg-red-50 px-4 py-3 rounded-xl hover:bg-red-100 hover:text-red-700 transition flex items-center gap-2 border-none focus:ring-2 focus:ring-red-500 outline-none text-sm font-bold text-gray-500">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                <span>Limpiar filtros</span>
            </button>
        </div>

        <div class="bg-white rounded-[3rem] shadow-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b-2 border-gray-100">
                        <th class="p-6 text-xs font-black text-blue-600 uppercase">Usuario / Grupo</th>
                        <th class="p-6 text-xs font-black text-blue-600 uppercase">Rol / Permisos</th>
                        <th class="p-6 text-xs font-black text-blue-600 uppercase">Estado</th>
                        <th class="p-6 text-xs font-black text-blue-600 uppercase text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-usuarios" class="divide-y divide-gray-100">
                </tbody>
            </table>
        </div>
    </div>
    </main>

    <!-- Modal Editar Usuario -->
    <div id="modalEditar"
        class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl transform transition-all scale-100">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black text-gray-800">Editar Usuario</h3>
                <button onclick="document.getElementById('modalEditar').classList.add('hidden')"
                    class="bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition">
                    <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                </button>
            </div>

            <form id="formEditarUsuario" class="space-y-4">
                <input type="hidden" id="edit-id">

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nombre Completo</label>
                    <input type="text" id="edit-nombre"
                        class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email / Login</label>
                    <input type="text" id="edit-email"
                        class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Rol</label>
                        <select id="edit-rol"
                            class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="operador">Operador (Básico)</option>
                            <option value="supervisor">Supervisor (Reportes)</option>
                            <option value="administrador">Administrador (Total)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Grupo</label>
                        <input type="text" id="edit-grupo"
                            class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <!-- Sección de Permisos Granulares -->
                <div class="pt-4 border-t border-gray-100">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Permisos Específicos</label>
                    <div id="permisos-container"
                        class="grid grid-cols-1 gap-2 bg-gray-50 p-3 rounded-xl max-h-40 overflow-y-auto">
                        <!-- Checkboxes generados dinámicamente -->
                        <div class="text-xs text-gray-400 italic">Cargando permisos...</div>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <label class="block text-xs font-bold text-red-400 uppercase mb-1">Resetear Contraseña
                        (Opcional)</label>
                    <input type="password" id="edit-password" placeholder="Dejar en blanco para no cambiar"
                        class="w-full bg-red-50/50 border-none rounded-xl px-4 py-3 font-semibold text-gray-800 focus:ring-2 focus:ring-red-500 outline-none placeholder-gray-400">
                </div>

                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                        GUARDAR CAMBIOS
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="admin.js"></script>
</body>

</html>
