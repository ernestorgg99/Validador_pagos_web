<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Validador Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md p-10 rounded-[3rem] shadow-2xl border-t-8 border-blue-600">
        <div class="text-center mb-10">
            <div class="bg-blue-100 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="shield-check" class="text-blue-600 w-12 h-12"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-800 uppercase tracking-tighter">Bienvenido</h1>
            <p class="text-gray-500 font-bold text-sm">Inicia sesión para validar pagos</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="text-xs font-black text-blue-600 uppercase ml-4 mb-2 block">Usuario</label>
                <input type="text" id="usuario" class="form-input" placeholder="Ej: •••••@gmail.com" required>
            </div>
            <div>
                <label class="text-xs font-black text-blue-600 uppercase ml-4 mb-2 block">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg transition-all transform active:scale-95 uppercase">
                Entrar al Sistema
            </button>
        </form>

        <div id="mensaje" class="hidden"></div>

        <div class="relative flex py-8 items-center">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink mx-4 text-gray-400 font-bold text-[10px] uppercase tracking-widest">O continúa con</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <div id="buttonDiv" class="flex justify-center"></div>

        <p class="text-center mt-8 text-gray-500 font-bold text-sm">
            ¿No tienes cuenta? <br>
            <a href="signup.html" class="text-blue-600 hover:underline font-black uppercase text-xs tracking-tight">Solicita acceso aquí</a>
        </p>
    </div>

    <script src="login.auth.js"></script>
</body>
</html>
