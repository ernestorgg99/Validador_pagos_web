<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Validador Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md p-10 rounded-[3rem] shadow-2xl border-t-8 border-green-500">
        
        <div class="text-center mb-8">
            <div class="bg-green-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="user-plus" class="text-green-600 w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-800 uppercase tracking-tighter">Nueva Cuenta</h1>
            <p class="text-gray-500 font-bold text-sm text-balance">Tus datos serán revisados por un administrador para el acceso.</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="text-[10px] font-black text-gray-400 uppercase ml-4 mb-1 block tracking-widest">Nombre Completo</label>
                <input type="text" id="nombre" class="form-input w-full !p-4" placeholder="Ej: Juan Pérez" required>
            </div>
            
            <div>
                <label class="text-[10px] font-black text-gray-400 uppercase ml-4 mb-1 block tracking-widest">Nombre de Usuario</label>
                <input type="text" id="usuario" class="form-input w-full !p-4" placeholder="Ej: jperez99" required>
            </div>

            <div>
                <label class="text-[10px] font-black text-gray-400 uppercase ml-4 mb-1 block tracking-widest">Correo Electrónico</label>
                <input type="email" id="email" class="form-input w-full !p-4" placeholder="correo@ejemplo.com" required>
            </div>

            <div>
                <label class="text-[10px] font-black text-gray-400 uppercase ml-4 mb-1 block tracking-widest">Contraseña</label>
                <input type="password" id="password" class="form-input w-full !p-4" placeholder="••••••••" required>
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg transition-all transform active:scale-95 uppercase mt-2">
                Solicitar Acceso
            </button>
        </form>

        <div id="mensaje" class="hidden"></div>

        <p class="text-center mt-8 text-gray-500 font-bold text-sm">
            ¿Ya tienes cuenta? <br>
            <a href="login.html" class="text-blue-600 hover:underline font-black uppercase text-xs">Volver al inicio de sesión</a>
        </p>
    </div>

    <script src="signup.auth.js"></script>
</body>
</html>
